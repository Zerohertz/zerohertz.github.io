<svg viewBox="0 0 880 570" xmlns="http://www.w3.org/2000/svg" width="880" height="570" font-family="&quot;Noto Serif KR&quot;, Georgia, serif" role="img" aria-label="tensor_0의 page는 disk와 RAM에 흩어져 있다가 pin_memory로 page-locked 영역에 고정되고, tensor_1은 to cuda 호출로 pinned memory를 거쳐 GPU로 옮겨진다">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a0a80" />
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a800a" />
    </marker>
  </defs>

  <rect x="40" y="30" width="400" height="372" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2" />
  <text x="240" y="54" text-anchor="middle" font-size="14" fill="#1a1a1a">Virtual memory</text>

  <rect x="60" y="66" width="360" height="100" rx="8" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="2" />
  <text x="240" y="90" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Disk</text>

  <rect x="60" y="182" width="360" height="200" rx="8" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="2" />
  <text x="240" y="206" text-anchor="middle" font-size="13.5" fill="#1a1a1a">RAM</text>

  <rect x="190" y="212" width="210" height="162" rx="8" fill="#ebebeb" stroke="#4a4a4a" stroke-width="2" />
  <text x="295" y="234" text-anchor="middle" font-size="13" fill="#1a1a1a">Pinned memory</text>

  <rect x="500" y="212" width="200" height="162" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2" />
  <text x="600" y="240" text-anchor="middle" font-size="13.5" fill="#1a1a1a">GPU</text>

  <line x1="92" y1="108" x2="92" y2="260" stroke="#0a0a80" stroke-width="2" />
  <line x1="126" y1="140" x2="126" y2="286" stroke="#0a800a" stroke-width="2" />

  <line x1="136" y1="286" x2="262" y2="286" stroke="#0a800a" stroke-width="2" marker-end="url(#ac)" />
  <line x1="330" y1="286" x2="537" y2="286" stroke="#0a800a" stroke-width="2" marker-end="url(#ac)" />
  <path d="M 92 270 L 92 342 L 262 342" fill="none" stroke="#0a0a80" stroke-width="2" marker-end="url(#ap)" />

  <g fill="#b8b8dd" stroke="#0a0a80" stroke-width="2">
    <circle cx="92" cy="108" r="10" />
    <circle cx="92" cy="140" r="10" />
    <circle cx="92" cy="234" r="10" />
    <circle cx="92" cy="260" r="10" />
  </g>
  <g fill="#b8ddb8" stroke="#0a800a" stroke-width="2">
    <circle cx="126" cy="140" r="10" />
    <circle cx="126" cy="234" r="10" />
    <circle cx="126" cy="260" r="10" />
    <circle cx="126" cy="286" r="10" />
  </g>
  <g fill="#ddb8b8" stroke="#800a0a" stroke-width="2">
    <circle cx="279" cy="272" r="10" />
    <circle cx="311" cy="272" r="10" />
    <circle cx="279" cy="300" r="10" />
    <circle cx="311" cy="300" r="10" />
  </g>
  <g fill="#b8b8dd" stroke="#0a0a80" stroke-width="2">
    <circle cx="279" cy="328" r="10" />
    <circle cx="311" cy="328" r="10" />
    <circle cx="279" cy="356" r="10" />
    <circle cx="311" cy="356" r="10" />
  </g>
  <g fill="#dddbb8" stroke="#80800a" stroke-width="2">
    <rect x="545" y="277" width="20" height="18" rx="3" />
    <rect x="569" y="277" width="20" height="18" rx="3" />
    <rect x="593" y="277" width="20" height="18" rx="3" />
    <rect x="617" y="277" width="20" height="18" rx="3" />
  </g>

  <circle cx="70" cy="450" r="10" fill="#b8b8dd" stroke="#0a0a80" stroke-width="2" />
  <circle cx="70" cy="480" r="10" fill="#b8ddb8" stroke="#0a800a" stroke-width="2" />
  <circle cx="70" cy="510" r="10" fill="#ddb8b8" stroke="#800a0a" stroke-width="2" />
  <rect x="60" y="531" width="20" height="18" rx="3" fill="#dddbb8" stroke="#80800a" stroke-width="2" />
  <g font-size="13" fill="#1a1a1a">
    <text x="94" y="455">Paged <tspan font-family="D2Coding, monospace">tensor_0</tspan></text>
    <text x="94" y="485">Paged <tspan font-family="D2Coding, monospace">tensor_1</tspan></text>
    <text x="94" y="515">Page-locked <tspan font-family="D2Coding, monospace">tensor_0</tspan></text>
    <text x="94" y="545">CUDA <tspan font-family="D2Coding, monospace">tensor_1</tspan></text>
  </g>

  <rect x="450" y="441" width="22" height="18" rx="3" fill="#fbfbfb" stroke="#9a9a9a" stroke-width="2" />
  <rect x="450" y="471" width="22" height="18" rx="3" fill="#ebebeb" stroke="#4a4a4a" stroke-width="2" />
  <line x1="450" y1="510" x2="482" y2="510" stroke="#0a800a" stroke-width="2" marker-end="url(#ac)" />
  <line x1="450" y1="540" x2="482" y2="540" stroke="#0a0a80" stroke-width="2" marker-end="url(#ap)" />
  <g font-size="13" fill="#1a1a1a">
    <text x="494" y="455">Pageable memory</text>
    <text x="494" y="485">Nonpageable (page-locked) memory</text>
    <text x="494" y="515" font-family="D2Coding, monospace">tensor_1.to("cuda")</text>
    <text x="494" y="545" font-family="D2Coding, monospace">tensor_0.pin_memory()</text>
  </g>
</svg>
